<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #6366f1;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 24px;
    text-align: center;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 1rem;
  }
  .buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .lesson {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .lesson:last-child { border-bottom: none; }
  .lesson-num {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }
  .lesson-name { margin: 4px 0; }
  .lesson-time { font-size: 0.85rem; color: var(--muted); }
  .status {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
  }
  .now-result {
    text-align: center;
    font-size: 1.05rem;
    padding: 8px 0;
  }
</style>
</head>
<body>
<div class="app">
  <h1>📅 Расписание</h1>

  <div class="card">
    <label for="group-select">Группа</label>
    <select id="group-select">
      <option value="">Загрузка...</option>
    </select>
    <div class="buttons">
      <button id="btn-today">Сегодня</button>
      <button id="btn-now">Сейчас</button>
    </div>
  </div>

  <div class="card" id="result-card">
    <div class="status">Выберите группу и нажмите одну из кнопок</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://bhodlpvktdfkhxwvucyc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TcTsZE_zC_WTqqEUtjlLMg_ZF5Sxu-K';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const groupSelect = document.getElementById('group-select');
  const resultCard = document.getElementById('result-card');
  const btnToday = document.getElementById('btn-today');
  const btnNow = document.getElementById('btn-now');

  const dayNamesRu = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

  function formatTime(t) {
    return t.slice(0, 5);
  }

  function toMinutes(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function getDbDayOfWeek() {
    return new Date().getDay(); // 0=Вс ... 6=Сб, совпадает с day_of_week в базе (1=Пн...6=Сб)
  }

  async function loadGroups() {
    const { data, error } = await supabase.from('groups').select('*').order('name');
    if (error || !data || data.length === 0) {
      groupSelect.innerHTML = '<option value="">Список групп пуст</option>';
      return;
    }
    groupSelect.innerHTML = data.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
  }

  function renderLessons(lessons, title) {
    if (!lessons || lessons.length === 0) {
      resultCard.innerHTML = `<div class="status">${title}<br>Пар нет</div>`;
      return;
    }
    resultCard.innerHTML = `
      <div style="margin-bottom: 8px; color: var(--muted); font-size: 0.85rem;">${title}</div>
      ${lessons.map(l => `
        <div class="lesson">
          <div class="lesson-num">${l.lesson_number} пара</div>
          <div class="lesson-name">${l.subject_name}</div>
          <div class="lesson-time">${formatTime(l.time_start)} - ${formatTime(l.time_end)}</div>
        </div>
      `).join('')}
    `;
  }

  async function handleToday() {
    const groupId = groupSelect.value;
    if (!groupId) return;

    const dbDay = getDbDayOfWeek();
    if (dbDay === 0) {
      resultCard.innerHTML = '<div class="status">Сегодня воскресенье, пар нет 🎉</div>';
      return;
    }

    resultCard.innerHTML = '<div class="status">Загрузка...</div>';
    const { data: lessons, error } = await supabase
      .from('schedule')
      .select('*')
      .eq('group_id', groupId)
      .eq('day_of_week', dbDay)
      .order('lesson_number');

    if (error) {
      resultCard.innerHTML = '<div class="status">Ошибка при загрузке расписания</div>';
      return;
    }

    renderLessons(lessons, `Расписание на сегодня (${dayNamesRu[new Date().getDay()]})`);
  }

  async function handleNow() {
    const groupId = groupSelect.value;
    if (!groupId) return;

    const dbDay = getDbDayOfWeek();
    if (dbDay === 0) {
      resultCard.innerHTML = '<div class="status">Сегодня воскресенье, пар нет 🎉</div>';
      return;
    }

    resultCard.innerHTML = '<div class="status">Загрузка...</div>';
    const { data: lessons, error } = await supabase
      .from('schedule')
      .select('*')
      .eq('group_id', groupId)
      .eq('day_of_week', dbDay)
      .order('lesson_number');

    if (error || !lessons || lessons.length === 0) {
      resultCard.innerHTML = '<div class="status">На сегодня пар нет</div>';
      return;
    }

    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    let current = null;
    let next = null;

    for (const l of lessons) {
      const start = toMinutes(l.time_start);
      const end = toMinutes(l.time_end);
      if (nowMinutes >= start && nowMinutes < end) {
        current = l;
        break;
      }
      if (nowMinutes < start && !next) {
        next = l;
      }
    }

    if (current) {
      resultCard.innerHTML = `
        <div class="now-result">
          Сейчас идёт <strong>${current.lesson_number} пара</strong><br>
          ${current.subject_name}<br>
          <span class="lesson-time">${formatTime(current.time_start)} - ${formatTime(current.time_end)}</span>
        </div>
      `;
    } else if (next) {
      resultCard.innerHTML = `
        <div class="now-result">
          Сейчас перемена.<br>
          Следующая пара в <strong>${formatTime(next.time_start)}</strong>:<br>
          ${next.subject_name}
        </div>
      `;
    } else {
      resultCard.innerHTML = '<div class="status">На сегодня все пары закончились</div>';
    }
  }

  btnToday.addEventListener('click', handleToday);
  btnNow.addEventListener('click', handleNow);

  loadGroups();
</script>
</body>
</html>
